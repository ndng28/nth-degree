name: Blog CI

on:
  push:
    branches:
      - "draft/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Astro types
        run: npx astro check

      - name: Build
        run: npm run build

  ai-tells:
    name: AI Tells Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for AI tells
        run: |
          python3 scripts/check-blog-ai-tells.py --no-install || {
            echo ""
            echo "AI tells detected — edit flagged files to remove AI patterns, then re-stage."
            echo "Bypass: git commit --no-verify (use sparingly)"
            exit 1
          }

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: npx markdownlint "src/content/blog/**/*.md" --disable-rule MD033 MD034

  broken-links:
    name: Link Checker
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install link checker
        run: npm install -g lychee

      - name: Build
        run: npm run build

      - name: Check links
        run: lychee --no-progress http://localhost:4321 --max-concurrency 5 || true